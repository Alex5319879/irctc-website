<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Train Info - IRCTC</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('indian-train-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      animation: fadeIn 1s ease-in;
    }

    .train-container {
      max-width: 900px;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      margin: 80px auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease-in;
    }

    h2 {
      text-align: center;
      color: #004b8d;
    }

    form {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-right: 10px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      background: #004b8d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1abc9c;
    }

    .btn-group {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    .btn-group a, .btn-group button {
      background-color: #004b8d;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 15px;
    }

    .btn-group a:hover,
    .btn-group button:hover {
      background-color: #1abc9c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #004b8d;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="train-container">
  <h2>🚆 Check Train Information</h2>

  <form onsubmit="getTrainInfo(event)">
    <input type="text" id="trainNo" placeholder="Enter Train Number" required>
    <button type="submit">🔍 Search</button>
  </form>

  <div class="btn-group">
    <a href="index.html">🏠 Back to Home</a>
    <button onclick="window.print()">🖨️ Print Info</button>
  </div>

  <div id="result"></div>
</div>

<script>
  async function getTrainInfo(e) {
    e.preventDefault();
    const trainNo = document.getElementById("trainNo").value.trim();
    if (!trainNo) return alert("Please enter a train number!");

    const url = `https://irctc1.p.rapidapi.com/api/v1/getTrainScheduleV2?trainNo=${trainNo}`;
    const options = {
      method: 'GET',
      headers: {
        'X-Rapidapi-Key': 'f957b3c575msh41c3321f0195484p111d83jsnb64cb4864077',
        'X-Rapidapi-Host': 'irctc1.p.rapidapi.com'
      }
    };

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "⏳ Loading...";

    try {
      const res = await fetch(url, options);
      const data = await res.json();

      if (data.status && data.data) {
        const train = data.data;
        let scheduleHTML = `
          <h3>${train.train_name} (${train.train_code})</h3>
          <p><strong>Type:</strong> ${train.type}</p>
          <p><strong>From:</strong> ${train.origin.station_name} → <strong>To:</strong> ${train.destination.station_name}</p>
          <p><strong>Available Classes:</strong> ${train.classes.join(", ")}</p>
          <h4>📋 Full Schedule:</h4>
          <table>
            <thead>
              <tr>
                <th>Station</th>
                <th>Code</th>
                <th>Arrive</th>
                <th>Depart</th>
                <th>Platform</th>
                <th>Distance (km)</th>
              </tr>
            </thead>
            <tbody>
        `;

        for (let stop of train.schedule) {
          scheduleHTML += `
            <tr>
              <td>${stop.station_name}</td>
              <td>${stop.station_code}</td>
              <td>${stop.arrive}</td>
              <td>${stop.depart}</td>
              <td>${stop.platform || '-'}</td>
              <td>${stop.distance}</td>
            </tr>
          `;
        }

        scheduleHTML += `</tbody></table>`;
        resultDiv.innerHTML = scheduleHTML;
      } else {
        resultDiv.innerHTML = "❌ Train not found or API limit reached.";
      }
    } catch (error) {
      console.error(error);
      resultDiv.innerHTML = "⚠️ Error fetching train information.";
    }
  }
</script>

</body>
</html>
